# openmw-install as a DreamWeave project: a Jess package. `jess` names the Package Source it publishes,
# the repository root's own jess.toml, and each release tag `openmw_install-<version>` is one version of
# the package, packed by the Mod Template from that tag; every push packs a development build.
id = "34eff1d9-fd7e-4c17-bf34-cdb8bf3ad546"
slug = "openmw_install"
type = "library"
status = "active"

[[maintainers]]
name = "DreamWeave"
url = "https://github.com/DreamWeave-MP"

[package]
format = "jpk"
jess = "org.dreamweave.openmw-install"

[[releases]]
version = "0.1.0"
date = 2026-10-21
summary = "First release published as a DreamWeave project."
